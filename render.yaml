services:
  - type: web
    name: feels-outdoor-matcher
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: USER_DAILY_REFRESH_LIMIT
        value: 15
      - key: SERPAPI_DAILY_BUDGET
        value: 15
      - key: DATABASE_PATH
        value: feels.db
